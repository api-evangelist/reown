  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
publisherName: Reown (WalletConnect Inc.)
serviceCategory: Web3
billingModel:
  pricingCategory: Subscription + MAW
  billingFrequency: Monthly
  billingCurrency: USD
  chargeCategories:
  - Usage
  - Purchase
focusColumns:
  ServiceName: Reown
  ServiceCategory: Web3
  ProviderName: Reown
  PublisherName: Reown
  InvoiceIssuerName: Reown
  BillingCurrency: USD
  ChargeCategory: Usage
meters:
- name: monthly_active_wallets
  description: Distinct wallet sessions per month.
  unit: wallet
  aggregation: count_distinct
  dimensions:
  - project_id
- name: notify_messages
  description: Notify push messages sent.
  unit: message
  aggregation: sum
  dimensions:
  - project_id
- name: rpc_requests
  description: Blockchain RPC requests.
  unit: request
  aggregation: sum
  dimensions:
  - project_id
  - chain
principles:
- name: Visibility
  description: Reown dashboard surfaces MAW and Notify usage.
- name: Allocation
  description: One projectId per app/environment.
- name: Optimization
  description: Use AppKit's built-in caching; avoid redundant RPC calls.
- name: Accountability
  description: Project owners review usage.
maintainers:
