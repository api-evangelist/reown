aid: reown
url: https://raw.githubusercontent.com/api-evangelist/reown/refs/heads/main/apis.yml
name: Reown
kind: company
description: Reown (formerly WalletConnect) provides Web3 connection infrastructure
  including AppKit (login + wallet integration UX), WalletConnect SDK (wallet-side),
  the Reown Cloud Explorer API (dApp/wallet directory), Push Notifications, and Multi-chain
  RPC. The WalletConnect protocol itself is SDK-mediated; Reown also exposes REST
  APIs for the Cloud Explorer.
accessModel:
  pricing: freemium
  onboarding: self-serve
  trial: false
  try_now: true
  public: false
  label: Freemium · Self-serve signup
  confidence: high
  source:
