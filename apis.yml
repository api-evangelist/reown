apis:
- aid: reown:explorer-api
  name: Reown Cloud Explorer API
  description: >-
    REST API to retrieve listings of WalletGuide-approved wallets, dApps, hybrid entries, and chains,
    plus logo assets. Filter by chain, platform, SDK, standard, or search term.
  humanURL: https://docs.reown.com/cloud/explorer
  baseURL: https://api.web3modal.org/v3
  tags:
  - REST
  - Directory
  properties:
  - type: Documentation
    url: https://docs.reown.com/cloud/explorer
- aid: reown:notify-api
  name: Reown Notify (Push) API
  description: >-
    REST API for sending wallet push notifications via the Reown Notify protocol, plus subject/topic management.
  humanURL: https://docs.reown.com/cloud/notify-api
  baseURL: https://notify.walletconnect.com
  tags:
  - REST
  - Push
  properties:
  - type: Documentation
    url: https://docs.reown.com/cloud/notify-api
- aid: reown:blockchain-api
  name: Reown Blockchain API
  description: >-
    Multi-chain JSON-RPC over HTTPS used by AppKit and partners; provides on-chain reads, gas, swaps,
    and onramp helpers.
  humanURL: https://docs.reown.com/cloud/blockchain-api
  baseURL: https://rpc.walletconnect.com/v1
  tags:
  - JSON-RPC
  - Multi-Chain
  tags_raw:
  - JSON-RPC
  - Multi-chain
  properties:
  - type: Documentation
    url: https://docs.reown.com/cloud/blockchain-api
- aid: reown:walletconnect-protocol
  name: WalletConnect Relay (SDK-mediated)
  description: >-
    WalletConnect v2 relay network for end-to-end encrypted JSON-RPC pairing between dApps and wallets.
    Accessed through SDK clients only; not a direct REST surface.
  humanURL: https://docs.reown.com/walletkit/overview
  baseURL: wss://relay.walletconnect.com
  tags:
  - WebSocket
  - Relay
  properties:
  - type: Documentation
    url: https://docs.reown.com/walletkit/overview
  - type: AsyncAPI
    url: asyncapi/reown-asyncapi.yml
- aid: reown:reown-chains-api
